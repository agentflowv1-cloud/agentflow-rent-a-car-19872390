<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentFlow Rent-a-Car</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f7f7f7;
            font-family: 'Open Sans', sans-serif;
        }
        
        .logo {
            font-size: 24px;
            color: #4567b7;
            cursor: pointer;
        }
        
        .nav-links {
            margin-left: 20px;
        }
        
        .car-card {
            margin-top: 50px;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        
        .car-card:hover {
            transform: scale(1.01);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }
        
        .card-image {
            width: 100%;
            height: 150px;
            background-image: linear-gradient(to bottom, #4567b7, #4567b7);
            background-size: 100% 300px;
            background-position: 0 300px;
            border-radius: 10px 10px 0 0;
        }
        
        .card-info {
            padding: 20px;
        }
        
        .card-title {
            font-size: 18px;
            font-weight: bold;
            color: #4567b7;
        }
        
        .card-subtitle {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <header>
        <nav class="container mx-auto flex justify-between py-4">
            <div class="logo">AgentFlow Rent-a-Car</div>
            <ul class="flex items-center font-bold ml-6 text-gray-600">
                <li class="nav-links mr-4 hover:text-gray-900"><a href="#">Home</a></li>
                <li class="nav-links mr-4 hover:text-gray-900"><a href="#">About</a></li>
                <li class="nav-links hover:text-gray-900"><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main class="container mx-auto mt-12">
        <section class="text-center">
            <h1 class="text-5xl font-bold mb-4">Explore our car rental options</h1>
            <p class="text-lg mb-8">Find the perfect car for your next adventure</p>
            <div class="grid md:grid-cols-3 gap-4 md:gap-6 justify-center items-center">
                <div class="bg-white rounded-md car-card">
                    <div class="card-image" style="background-size: 100% 150px; background-position: 0 0;"></div>
                    <div class="card-info flex justify-between">
                        <div class="p-4">
                            <h2 class="card-title mb-2">Sedan</h2>
                            <p class="card-subtitle mb-4">Starts at $40/day</p>
                            <button class="bg-gray-900 hover:bg-gray-800 text-white font-bold py-2 px-4 rounded">Book Now</button>
                        </div>
                        <img src="#" alt="Sedan image" class="w-24 h-24 object-cover rounded-full bg-gray-400">
                    </div>
                </div>
                <div class="bg-white rounded-md car-card">
                    <div class="card-image" style="background-size: 100% 150px; background-position: 0 0;"></div>
                    <div class="card-info flex justify-between">
                        <div class="p-4">
                            <h2 class="card-title mb-2">SUV</h2>
                            <p class="card-subtitle mb-4">Starts at $60/day</p>
                            <button class="bg-gray-900 hover:bg-gray-800 text-white font-bold py-2 px-4 rounded">Book Now</button>
                        </div>
                        <img src="#" alt="SUV image" class="w-24 h-24 object-cover rounded-full bg-gray-400">
                    </div>
                </div>
                <div class="bg-white rounded-md car-card">
                    <div class="card-image" style="background-size: 100% 150px; background-position: 0 0;"></div>
                    <div class="card-info flex justify-between">
                        <div class="p-4">
                            <h2 class="card-title mb-2">Truck</h2>
                            <p class="card-subtitle mb-4">Starts at $80/day</p>
                            <button class="bg-gray-900 hover:bg-gray-800 text-white font-bold py-2 px-4 rounded">Book Now</button>
                        </div>
                        <img src="#" alt="Truck image" class="w-24 h-24 object-cover rounded-full bg-gray-400">
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer class="text-gray-600 bg-gray-900 py-4">
        <div class="container mx-auto text-center">
            <p>AgentFlow Rent-a-Car &copy; 2023</p>
        </div>
    </footer>
</body>
</html>
